    </head>
    <body>
        <div id="screen">
            <div id="progressBarContainer">
                <div class="loading-brand">DOOM ONLINE</div>
                <div class="loading-bar-track"><div id="progressBar"></div></div>
                <div class="loading-label">Loading DOOM assets...</div>
            </div>
        </div>
        <script src="./js/webapp/appBootstrap.js"></script>
        <script>
            // Unregister any broken/stale service workers from previous visits
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (const r of registrations) {
                        try { r.unregister(); } catch (_) {}
                    }
                });
            }
            if ('caches' in window) {
                caches.keys().then(keys => {
                    for (const k of keys) {
                        try { caches.delete(k); } catch (_) {}
                    }
                });
            }
            // Disable PWA service worker mode for GitHub Pages to load directly, stably and fast
            appBootstrap.disablePwaMode();
            appBootstrap.addBootstrapDefinition('./js/libBootstrap.json');
            appBootstrap.init();
        </script>
    </body>
